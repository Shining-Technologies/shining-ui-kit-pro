name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # packages/ui, then the gallery against its source.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The chart suites again with Recharts 3 aliased in, so both majors the
      # peer range promises stay working.
      - name: Test charts against Recharts 3
        run: pnpm test:recharts3

      - name: Check documentation links
        run: pnpm check:docs

      - name: Build
        run: pnpm build

      # Catches the packaging mistakes that only surface after publishing:
      # an entry point that was never built, a stale dist, a missing README,
      # and type declarations that resolve under one moduleResolution but not
      # another. Cheap here, expensive as a patch release.
      - name: Check publishability
        run: pnpm prepublish:check
